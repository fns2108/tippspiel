<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A ballot square with a mark: the app is one decision, repeated. Square
       corners and a single stroke weight match the interface it opens. -->
  <rect width="32" height="32" rx="3" fill="#111112"/>
  <path d="M8.5 16.5 13.5 21.5 24 11"
        fill="none" stroke="#FBFBFA" stroke-width="3.25"
        stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
